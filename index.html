const rnd=n=>Math.random()*n|0,shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};

 return L.map(x=>{const k=rnd(3),w=[x[2],x[3]],a=[];for(let i=0,j=0;i<3;i++)a.push(i==k?x[1]:w[j++]);return{q:x[0],a,k}})}

const cv=$('cv'),R3=new THREE.WebGLRenderer({canvas:cv,antialias:true}),sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(62,1,.1,280);

const M=c=>new THREE.MeshLambertMaterial({color:c}),BX=(w,h,d,c)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));
const tc=document.createElement('canvas');tc.width=tc.height=128;{const x=tc.getContext('2d');x.fillStyle='#3a3f4b';x.fillRect(0,0,128,128);x.fillStyle='#fff';x.fillRect(0,0,128,5);x.fillStyle='#ffd166';[0,1,2,3].forEach(i=>x.fillRect(i*42.7-2,0,4,128))}
const gt=new THREE.CanvasTexture(tc);gt.wrapS=gt.wrapT=THREE.RepeatWrapping;gt.repeat.set(1,40);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(9,400),new THREE.MeshLambertMaterial({map:gt}));ground.rotation.x=-Math.PI/2;sc.add(ground);
const side=[-1,1].map(s=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(60,400),M(0x5aa469));m.rotation.x=-Math.PI/2;m.position.set(s*34.5,-.02,0);sc.add(m);return m});
const bld=[];for(let i=0;i<16;i++){const b=BX(5,1,5,[0xe9c46a,0xb5838d,0x8ecae6,0xcdb4db][i%4]);sc.add(b);bld.push(b)}
const obs=[],coins=[];for(let i=0;i<10;i++){const o=BX(2.3,1,1.2,0xff7b00);sc.add(o);obs.push(o);
 for(let k=0;k<3;k++){const c=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,.12,16),new THREE.MeshLambertMaterial({color:0xffd700,emissive:0x665500}));c.rotation.x=Math.PI/2;sc.add(c);coins.push(c)}}
const finM=BX(9,.1,1.5,0xffffff);{const c=document.createElement('canvas');c.width=64;c.height=8;const x=c.getContext('2d');for(let i=0;i<16;i++){x.fillStyle=i%2?'#000':'#fff';x.fillRect(i*4,0,4,8)}finM.material=new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c)});finM.position.y=.06;finM.visible=false;sc.add(finM)}
function limb(g,x,y,w,h,c){const p=new THREE.Group();p.position.set(x,y,0);const m=BX(w,h,w,c);m.position.y=-h/2;p.add(m);g.add(p);return p}

function avatar(col,name,ghost){const g=new THREE.Group(),b=(w,h,d,x,y,z,c)=>{const m=BX(w,h,d,c);m.position.set(x,y,z);g.add(m);return m};
 b(.8,.8,.8,0,2.2,0,0xffd166);b(.14,.14,.05,-.18,2.28,-.41,0x222222);b(.14,.14,.05,.18,2.28,-.41,0x222222);b(.95,1,.5,0,1.3,0,col);
 g.aL=limb(g,-.62,1.75,.3,.9,0xffd166);g.aR=limb(g,.62,1.75,.3,.9,0xffd166);g.lL=limb(g,-.25,.8,.4,.8,0x264653);g.lR=limb(g,.25,.8,.4,.8,0x264653);
 if(ghost)g.traverse(o=>{if(o.material){o.material.transparent=true;o.material.opacity=.7}});if(name)g.add(tag(name));sc.add(g);return g}
function swing(g,t,sp,air){const a=air?.3:Math.sin(t*12)*.9*sp;g.lL.rotation.x=a;g.lR.rotation.x=-a;g.aL.rotation.x=air?-2.6:-a;g.aR.rotation.x=air?-2.6:a}
// gate
const gate=new THREE.Group(),banners=[];sc.add(gate);gate.visible=false;
for(let i=0;i<3;i++){const gp=new THREE.Group();gp.position.x=(i-1)*3;[-1.4,1.4].forEach(x=>{const p=BX(.25,3.2,.25,parseInt(GC[i].slice(1),16));p.position.set(x,1.6,0);gp.add(p)});
 const bn=new THREE.Mesh(new THREE.PlaneGeometry(2.9,1.3),new THREE.MeshBasicMaterial({color:0xffffff}));bn.position.y=3.6;gp.add(bn);banners.push(bn);gate.add(gp)}
function setBanners(q){q.a.forEach((t,i)=>{const c=document.createElement('canvas');c.width=512;c.height=230;const x=c.getContext('2d');x.fillStyle=GC[i];x.fillRect(0,0,512,230);x.fillStyle='rgba(255,255,255,.95)';x.font='bold 50px sans-serif';x.textAlign='left';x.fillText('ABC'[i],16,56);
 let fs=76;x.textAlign='center';do{x.font=`bold ${fs}px sans-serif`;fs-=4}while(x.measureText(t).width>480&&fs>20);x.fillText(t,256,150);
 const old=banners[i].material.map;banners[i].material.map=new THREE.CanvasTexture(c);banners[i].material.color.set(0xffffff);banners[i].material.needsUpdate=true;if(old)old.dispose()})}
// ---------- state ----------
let room=null,code='',phase='menu',host=false,lastGo=0,SEED=1,me={n:'Pemain',c:0},qs=[],qi=0,dist=0,sp=0,lane=1,px=0,y=0,vy=0,score=0,boost=0,slow=0,got=new Set,hit=new Set,fz=0,finished=false,T=0,lastPub=0,rem={},started=0;
const hs=(a,b)=>{const x=Math.sin(a*127.1+b*311.7+SEED*.37)*43758.5453;return x-Math.floor(x)};
const gz=k=>G0+k*GAP,near=z=>{const d=((z-G0)%GAP+GAP)%GAP;return d<38||d>GAP-38};
function chunk(c){if(c<3||near(c*20+10))return{ob:-1,cl:-1};return{ob:hs(c,1)<.65?rnd2(c,2):-1,cl:rnd2(c,3)}}const rnd2=(c,k)=>Math.floor(hs(c,k)*3);
const me3=avatar(COL[0],null,false);me3.visible=false;
const ps=()=>room?room.peers():[];const others=()=>ps().filter(p=>!p.isMe&&p.presence.n);

function toast(t,c){const e=$('toast');e.textContent=t;e.style.color=c;clearTimeout(toast.t);toast.t=setTimeout(()=>e.textContent='',1100)}
function show(id){['menu','lobby','end'].forEach(s=>$(s).classList.toggle('on',s==id));$('hud').style.display=id==null?'block':'none'}

// ---------- room (MQTT publik) ----------
function makeRoom(create,code){return new Promise((res,rej)=>{
 if(!window.mqtt){rej(new Error('Library online gagal dimuat, cek internet lalu muat ulang'));return}
 const id=Math.random().toString(36).slice(2,10),base='rrquiz9/'+code.toLowerCase(),st={peers:{},seen:{},cbs:[],mine:{}},fire=()=>st.cbs.forEach(f=>{try{f()}catch(e){}});
 const BR=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081'];
 let cl,iv,bi=0;
 const room={peers:()=>[{peer:id,isMe:true,presence:st.mine}].concat(Object.keys(st.peers).map(k=>({peer:k,isMe:false,presence:st.peers[k]}))),
  presence:p=>{Object.assign(st.mine,p);if(cl&&cl.connected)cl.publish(base+'/'+id,JSON.stringify(st.mine));return Promise.resolve()},

 const tryB=()=>{if(bi>=BR.length){rej(new Error('Tidak bisa terhubung ke server online. Coba ganti jaringan (misal data seluler) lalu muat ulang.'));return}
  const c=mqtt.connect(BR[bi++],{clientId:'rq'+id,connectTimeout:5000,reconnectPeriod:0,will:{topic:base+'/'+id,payload:'{"bye":1}'}});let ok=false,moved=false;
  const nxt=()=>{if(!ok&&!moved){moved=true;try{c.end(true)}catch(e){}tryB()}};
  c.on('connect',()=>{ok=true;cl=c;c.subscribe(base+'/+',err=>{if(err){rej(new Error('Gagal masuk room'));return}
   c.publish(base+'/'+id,JSON.stringify(st.mine));
   iv=setInterval(()=>{if(c.connected)c.publish(base+'/'+id,JSON.stringify(st.mine));const n=Date.now();let ch=false;for(const k in st.seen)if(n-st.seen[k]>7000){delete st.peers[k];delete st.seen[k];ch=true}if(ch)fire()},2000);res(room)})});
  c.on('message',(t,m)=>{const k=t.split('/').pop();if(k==id)return;let d;try{d=JSON.parse(m.toString())}catch(e){return}if(d.bye){delete st.peers[k];delete st.seen[k]}else{st.peers[k]=d;st.seen[k]=Date.now()}fire()});
  c.on('error',nxt);c.on('close',nxt);setTimeout(nxt,6000)};
 tryB()})}
async function enter(create,cd,solo){au();$('err').textContent='';me.n=($('nm').value.trim()||'Pemain'+rnd(99)).slice(0,12);host=create||solo;

 let P=[];for(let i=0;i<20;i++){await new Promise(r=>setTimeout(r,300));P=room.peers().filter(p=>!p.isMe&&p.presence.n);if(create?i>=3:P.some(p=>p.presence.h))break}
 if(!create&&!P.some(p=>p.presence.h)){room.leave();room=null;$('err').textContent='Room tidak ditemukan';return}
 if(P.length>=10){room.leave();room=null;$('err').textContent='Room penuh (10/10)';return}
 const used=P.map(p=>p.presence.c);me.c=[...Array(10).keys()].find(i=>!used.includes(i));
 const h=P.find(p=>p.presence.h);lastGo=h?h.presence.go||0:0;
 room.onPeers(onPeers);startLobby()}
function startLobby(){phase='lobby';$('rc').textContent=code;me3.children.forEach(()=>{});pub({n:me.n,c:me.c,h:host?1:0,go:0,s:0,f:0,d:0});show('lobby');renderLobby()}

 const h=P.find(p=>p.presence.h&&!p.isMe);if(h&&h.presence.go&&h.presence.go!==lastGo&&phase!='play'){lastGo=h.presence.go;begin(lastGo)}
 if(phase=='lobby')renderLobby()}

// ---------- game ----------
function begin(seed){au();SEED=seed;qs=buildQs();qi=0;dist=0;sp=0;lane=1;px=0;y=0;vy=0;score=0;boost=0;slow=0;got=new Set;hit=new Set;finished=false;fz=0;finM.visible=false;started=performance.now();
 phase='play';pub({s:0,f:0,d:0,q:0});show(null);gate.visible=true;setBanners(qs[0]);music(true);toast('Siap… LARI!','#ffd166');showQ()}
function showQ(){const q=qs[Math.min(qi,NQ-1)];$('qp').innerHTML=finished||qi>=NQ?'🏁 Menuju garis finis!':`<small>Soal ${qi+1}/${NQ}</small>${esc(q.q)}`}
function mv(d){if(phase!='play')return;const n=Math.max(0,Math.min(2,lane+d));if(n!=lane){lane=n;sfx.slide()}}
function jmp(){if(phase=='play'&&y<=.01){vy=9.5;sfx.jump()}}
addEventListener('keydown',e=>{const k=e.key;if(k=='ArrowLeft'||k=='a'||k=='A')mv(-1);else if(k=='ArrowRight'||k=='d'||k=='D')mv(1);else if(k==' '||k=='ArrowUp'||k=='w'||k=='W'){e.preventDefault();jmp()}});
$('bl').onpointerdown=()=>mv(-1);$('br').onpointerdown=()=>mv(1);$('bj').onpointerdown=()=>jmp();
let t0=null;addEventListener('touchstart',e=>{t0=e.touches[0]},{passive:true});
addEventListener('touchend',e=>{if(!t0)return;const t=e.changedTouches[0],dx=t.clientX-t0.clientX,dy=t.clientY-t0.clientY;t0=null;
 if(Math.abs(dx)>30&&Math.abs(dx)>Math.abs(dy))mv(dx>0?1:-1);else if(dy<-30)jmp()},{passive:true});
function step(dt){if(phase!='play')return;
 const tgt=14*(boost>0?1.7:1)*(slow>0?.5:1);sp+=(tgt-sp)*Math.min(1,dt*4);boost-=dt;slow-=dt;dist+=sp*dt;
 vy-=26*dt;y+=vy*dt;if(y<0){y=0;vy=0}px+=((lane-1)*3-px)*Math.min(1,dt*14);
 const c0=Math.floor(dist/20);for(let c=c0-1;c<=c0+1;c++){const o=chunk(c);
  if(o.ob>=0&&!hit.has(c)&&Math.abs(dist-(c*20+16))<.9&&o.ob==lane&&y<1.05){hit.add(c);slow=1.4;score=Math.max(0,score-5);sfx.hit();toast('Aduh! -5','#ff8a8a')}
  if(o.cl>=0)for(let k=0;k<3;k++){const id=c*3+k;if(!got.has(id)&&Math.abs(dist-(c*20+2+k*4))<1.1&&o.cl==lane&&y<2){got.add(id);score+=10;sfx.coin()}}}
 if(qi<NQ&&dist>=gz(qi)){const q=qs[qi];if(lane==q.k){score+=100;boost=3;sfx.good();toast('BENAR! +100 🚀','#7CFC00')}else{slow=3;sfx.bad();toast('SALAH! Jawaban: '+'ABC'[q.k],'#ff6b6b')}
  qi++;if(qi<NQ){gate.position.z=-gz(qi);setBanners(qs[qi])}else{gate.visible=false;fz=gz(NQ-1)+110;finM.position.z=-fz;finM.visible=true}showQ()}
 if(qi>=NQ&&dist>=fz&&!finished){finished=true;score+=50;phase='fin';music(false);sfx.good();pub({s:score,f:1,d:dist,q:qi});showEnd()}}
function render(t){T=t/1000;const air=y>.05;me3.visible=phase=='play'||phase=='fin';me3.position.set(px,y,-dist);swing(me3,T,sp/14,air);
 const camx=px*.6;cam.position.set(camx,4.6+y*.3,-dist+8.5);cam.lookAt(camx,1.6,-dist-10);
 ground.position.z=-dist-100;gt.offset.y=dist/10;side.forEach(s=>s.position.z=-dist-100);
 const c0=Math.floor(dist/20)-1;for(let c=c0;c<c0+10;c++){const sl=((c%10)+10)%10,o=chunk(c),ob=obs[sl];ob.visible=o.ob>=0&&c>=0;if(ob.visible)ob.position.set((o.ob-1)*3,.5,-(c*20+16));
  for(let k=0;k<3;k++){const m=coins[sl*3+k];m.visible=o.cl>=0&&c>=0&&!got.has(c*3+k);if(m.visible){m.position.set((o.cl-1)*3,1.2,-(c*20+2+k*4));m.rotation.z=T*4}}}
 const k0=Math.floor(dist/30)-1;bld.forEach((b,i)=>{const k=k0+(i>>1),h=hs(k,i+9);b.scale.y=3+h*10;b.position.set((i&1?1:-1)*(8+h*4),b.scale.y/2,-k*30)});
 if(phase=='play'||phase=='fin'){if(qi<NQ)gate.position.z=-gz(qi)}
 const live=new Set;others().forEach(p=>{live.add(p.peer);const r=p.presence;let a=rem[p.peer];if(!a)a=rem[p.peer]={g:avatar(COL[r.c||0],r.n,true),x:0};a.x+=(((r.l??1)-1)*3-a.x)*.25;a.g.position.set(a.x,r.y||0,-(r.d||0));swing(a.g,T,1,(r.y||0)>.05);a.g.visible=phase!='lobby'})
 for(const k in rem)if(!live.has(k)){sc.remove(rem[k].g);delete rem[k]}
 R3.render(sc,cam)}
let last=performance.now();function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;step(dt);render(t);
 if(phase=='play'||phase=='fin'){if(t-lastPub>100){lastPub=t;pub({l:lane,d:Math.round(dist*10)/10,y:Math.round(y*10)/10,s:score,q:qi,f:finished?1:0});$('sc').textContent='⭐ '+score;
  $('lb').innerHTML=allRows().map((r,i)=>`<div class="${r.me?'me':''}"><span>${i+1}. ${esc(r.n)}</span><b>${r.s}</b></div>`).join('')}}
 requestAnimationFrame(loop)}requestAnimationFrame(loop);
// ---------- end ----------
function showEnd(){show('end');renderEnd()}
function renderEnd(){const rows=allRows(),done=rows.every(r=>r.f);const fin=rows.filter(r=>r.f).length;
 $('et').textContent=done?'🏆 Podium Juara':'🏁 Kamu Sudah Finis!';
 $('ed').textContent=done?'Semua pemain selesai menjawab 10 soal.':`Menunggu pemain lain… (${fin}/${rows.length} selesai)`;
 const o=[1,0,2].filter(i=>rows[i]),hh=[110,150,80],md=['🥈','🥇','🥉'];
 $('pod').innerHTML=done?o.map(i=>`<div style="background:${hx(COL[rows[i].c||0])};height:${[150,110,80][i]}px">${md[i==0?1:i==1?0:2]}<br>${esc(rows[i].n)}<br>${rows[i].s}</div>`).join(''):'';
 $('el').innerHTML=rows.map((r,i)=>`<div class="row"><span>${i+1}. <i class="dot" style="background:${hx(COL[r.c||0])}"></i>${esc(r.n)}${r.me?' (kamu)':''}${r.f?'':' …'}</span><b>${r.s}</b></div>`).join('');
 $('again').style.display=done?'':'none';$('again').disabled=!host;$('again').textContent=host?'Main Lagi (soal baru)':'Menunggu host…'}
setInterval(()=>{if(phase=='fin')renderEnd()},500);
</script></body></html>
